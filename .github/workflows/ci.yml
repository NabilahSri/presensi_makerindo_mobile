name: CI Server (Laravel Web & API)

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'package.json'
      - '.github/workflows/ci.yml'

jobs:
  server-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/server/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment & SQLite
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Install NPM dependencies & build assets
        run: |
          npm ci
          npm run build

      - name: Run Laravel Pint (style check)
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit tests
        run: php artisan test
