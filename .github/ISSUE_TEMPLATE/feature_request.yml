name: Feature request (Mobile)
description: Usulkan fitur atau perbaikan pada aplikasi mobile Flutter
labels: [enhancement, mobile]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Dampak (UI Flutter, GPS/kamera, penyimpanan lokal, atau butuh perubahan REST API)
