name: Feature request
description: Usulkan fitur atau perbaikan pada Web Portal / Backend API
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan solusi
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Dampak (RBAC, kontrak API mobile, database, UI web)
