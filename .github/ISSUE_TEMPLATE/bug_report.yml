name: Bug report
description: Laporkan bug pada Web Portal atau Backend API (JANGAN untuk kerentanan keamanan, lihat SECURITY.md)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
  - type: dropdown
    id: component
    attributes:
      label: Komponen terdampak
      options:
        - Web Portal (Laravel Blade)
        - REST API (/api/...)
        - Database / Migrasi / Seeder
        - Lainnya
  - type: input
    id: role
    attributes:
      label: Peran pengguna (super_admin / ceo / karyawan / intern)
  - type: textarea
    id: logs
    attributes:
      label: Log / screenshot (tanpa data pribadi, token, atau secret)
